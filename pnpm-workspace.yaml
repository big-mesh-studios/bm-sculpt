# bm-sculpt is a single-package repository today. The catalog exists anyway,
# because every version below is one more than one place in this repository —
# and eventually the Solid core, the rendering engine, and a third workspace
# will all depend on them.
#
# Two packages that end up on different versions of the same dependency do not
# type-check where their classes meet: one class from two copies is two classes,
# each with its own declarations of the private fields the other one lacks. A
# catalog is how that is prevented rather than discovered.
packages: []

# esbuild ships a platform binary that its postinstall resolves; without this
# the install silently produces a package with no binary in it.
allowBuilds:
  esbuild: true

catalog:
  # Solid 2.0 is a coordinated release: the reactive core (@solidjs/signals), the
  # DOM runtime (@solidjs/web) and the framework (solid-js) share a version number
  # and must agree on it. A mismatch does not degrade, it fails to type-check.
  #
  # **Beta, not release candidate** — and the reason is the build toolchain rather
  # than the framework. From `vite-plugin-solid@3.0.0-next.21` the plugin delegates
  # to `@solidjs/vite-plugin`, which drives the *native* Solid compiler: a platform
  # binary, with a WebAssembly fallback only where no binary exists for the
  # platform. Termux is one of those platforms — it is Linux on arm64 but uses
  # Bionic rather than glibc, so the published `linux-arm64-gnu` binary will not
  # load, and the WebAssembly fallback is blocked by the sandbox, failing with
  # `UVWASI_EACCES, uvwasi_init` before any code runs.
  #
  # `3.0.0-next.5` transforms JSX with Babel and `@babel/core`, which are pure
  # JavaScript and have no platform to disagree with. That is the combination
  # `big-mesh-studios` builds both of its applications with, and its peer ranges
  # cover this exactly: Solid `>=2.0.0-beta.0 <2.0.0-experimental.0` and Vite up
  # to 8.
  "solid-js": "2.0.0-beta.29"
  "@solidjs/signals": "2.0.0-beta.29"
  "@solidjs/web": "2.0.0-beta.29"

  # The last Babel-based line of this plugin. Its `latest` is still 2.11, which is
  # Solid 1, and its `next` is the native-compiler line described above.
  "vite-plugin-solid": "3.0.0-next.5"

  # The JSX transform, pinned to match the framework. The plugin asks for
  # `>=2.0.0-beta.0 <2.0.0-experimental.0`, which floats forward to the newest beta
  # — and each `babel-preset-solid` declares a peer of `^2.0.0-beta.<its own>`, so a
  # floating resolve lands on a preset that wants a newer framework than the one
  # installed. It works anyway, since the peer is advisory and the transform has not
  # changed incompatibly across these betas, but a repository whose stated reason
  # for pinning a version is that a mismatch fails to type-check should not also be
  # carrying one. The override below pins the transitive resolve.
  "babel-preset-solid": "2.0.0-beta.29"

minimumReleaseAgeExclude:
  - '@random-mesh/rmsl@1.15.0'

overrides:
  babel-preset-solid: "catalog:"

  # The renderer. Not a three.js fork: a scene graph plus a node-graph shader DSL.
  # See docs/adr/0001-rmsl-over-three.md.
  "@random-mesh/rmsl": "1.15.0"

  vite: "^8.3.1"
  vitest: "^4.1.3"
  typescript: "^5.7.2"
  prettier: "^3.9.6"
  jsdom: "^30.0.1"
