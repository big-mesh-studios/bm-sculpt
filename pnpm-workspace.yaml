# One repository, one signed distance field core, two applications, and the front
# page that links to them.
#
# **Anything that is a library is under `packages/`, and anything that is an
# application is under `apps/`.** That is the whole structure, and it is enforced by
# `tools/workspace.ts` rather than only stated here, because a rule nobody checks is a
# rule that quietly stops being true.
#
# The catalog exists for the reason it existed when this was one package: two
# workspaces on different versions of one library are two copies of its classes,
# each with its own declarations of the private fields the other lacks, and the place
# they meet stops type-checking.

packages:
  - "apps/*"
  - "packages/*"

# esbuild ships a platform binary that its postinstall resolves; without this
# the install silently produces a package with no binary in it.
allowBuilds:
  esbuild: true

# Every version that more than one workspace depends on is written here once, and each
# one asks for "catalog:" rather than naming a range of its own.
catalog:
  # Solid 2.0 is a coordinated release: the reactive core (@solidjs/signals), the DOM
  # runtime (@solidjs/web) and the framework (solid-js) share a version number and must
  # agree on it. A mismatch does not degrade, it fails to type-check.
  #
  # **Beta, not release candidate** — and the reason is the build toolchain rather than
  # the framework. From `vite-plugin-solid@3.0.0-next.21` the plugin delegates to
  # `@solidjs/vite-plugin`, which drives the *native* Solid compiler: a platform binary,
  # with a WebAssembly fallback only where no binary exists for the platform. Termux is
  # one of those platforms — it is Linux on arm64 but uses Bionic rather than glibc, so
  # the published `linux-arm64-gnu` binary will not load, and the WebAssembly fallback
  # is blocked by the sandbox, failing with `UVWASI_EACCES, uvwasi_init` before any code
  # runs.
  #
  # `3.0.0-next.5` transforms JSX with Babel and `@babel/core`, which are pure
  # JavaScript and have no platform to disagree with. That is the combination
  # `big-mesh-studios` builds both of its applications with, and its peer ranges cover
  # this exactly: Solid `>=2.0.0-beta.0 <2.0.0-experimental.0` and Vite up to 8.
  "solid-js": "2.0.0-beta.29"
  "@solidjs/signals": "2.0.0-beta.29"
  "@solidjs/web": "2.0.0-beta.29"

  # The last Babel-based line of this plugin. Its `latest` is still 2.11, which is
  # Solid 1, and its `next` is the native-compiler line described above.
  "vite-plugin-solid": "3.0.0-next.5"

  # The JSX transform, pinned to match the framework, and repeated under `overrides:`
  # below for a different reason: nothing here writes it by name, so a catalog entry
  # alone would not stop a transitive resolve floating forward to a preset that wants a
  # newer framework than the one installed.
  "babel-preset-solid": "2.0.0-beta.29"

  # The place-script interpreter, as pure WebAssembly — see ADR 0015. Two packages,
  # deliberately: `core` is the API and the runtime, and `wasmfile-release-sync` is one
  # specific build of the interpreter as a single synchronously-readable file. They must
  # be the same version, because the core package dispatches into the wasm build's own
  # ABI.
  "quickjs-emscripten-core": "0.32.0"
  "@jitl/quickjs-wasmfile-release-sync": "0.32.0"

  # The renderer. Not a three.js fork: a scene graph plus a node-graph shader DSL. See
  # docs/adr/0001-rmsl-over-three.md.
  #
  # **Pinned exactly rather than by range.** A shader library is allowed to change what a
  # program means between minor versions, and the six `SkyLight` bindings are read by name
  # at build time — a patch release that renamed one would compile and then draw nothing.
  "@random-mesh/rmsl": "1.15.0"

  # Build and test tooling, shared by every workspace.
  vite: "^8.3.1"
  vitest: "^4.1.3"
  typescript: "^5.7.2"
  prettier: "^3.9.6"
  jsdom: "^30.0.1"

  # Node's own declarations, for the root workspace only. `tools/` is the one part of
  # this repository that runs in Node rather than in a browser, and it needs `fs` and
  # `path` typed; no package under `packages/` or `apps/` may see them.
  "@types/node": "^24.10.1"

  # Reads a place zip. The same version the sibling project pins, so a place authored
  # there opens here and the two cannot disagree about what a zip is. Dynamically
  # imported, so it reaches only the `/place:open` path and never the first frame.
  jszip: "^3.10.2"

minimumReleaseAgeExclude:
  - '@random-mesh/rmsl@1.15.0'

overrides:
  # The one version that has to be pinned as an override rather than catalogued, and it
  # is not a version anybody chose. `babel-preset-solid` declares a peer range that floats
  # forward to the newest beta, and each beta wants a different framework version, so a
  # floating resolve installs a preset that does not match the Solid it is transforming.
  # The catalog entry above is what packages ask for; this is what stops the transitive
  # resolve, and nothing in this repository writes it by name.
  babel-preset-solid: "catalog:"