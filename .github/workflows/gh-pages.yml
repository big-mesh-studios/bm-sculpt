name: Deploy the site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Pushing the published branch is what publishes the site, so this is the
# permission the job actually needs.
permissions:
  contents: write

# One Pages site and one publisher. Two runs at once — a second push landing while
# the first is still pushing — would interleave two histories on the branch, and
# whichever finished last would be the one served. Cancelling the earlier run is
# the better of the two outcomes: its commit is superseded either way, and the one
# that survives is the newer tree.
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The version is not written here. `pnpm/action-setup` reads it from
      # `packageManager` in package.json, so the version this site is built with is
      # written down once and is the same one Corepack hands a contributor locally.
      # Naming it here as well would be a second copy free to disagree with the
      # first, which is the failure this arrangement exists to prevent.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nothing tells this step where the site is served from, and that is the
      # point. `base: "./"` in vite.config.ts makes every asset address in the built
      # index.html relative (`./assets/...`), and the meshing workers are emitted
      # as a URL resolved against the importing module, so each one lands beside
      # the bundle that asked for it rather than at the site root. A build from
      # this job is therefore correct served from `/bm-sculpt/`, from any other
      # subdirectory, and from a local static server, with no environment variable
      # to get wrong — and the same `pnpm build` a contributor runs locally is
      # byte-for-byte the build that ships.
      - run: pnpm build

      # `pnpm build` is `pnpm -r build`, so each app builds into its own
      # `apps/*/dist` and the root has no `dist` of its own any more. Everything
      # below is therefore copying *out of* an app rather than publishing one
      # bare `./dist`.
      #
      # **Three applications and one site: a front page at the root, and the two
      # applications beside it in folders of their own.**
      #
      # This reverses an earlier arrangement, and the reason it was there is
      # worth keeping in the record: the landscape used to be published *at* the
      # root, so that its address would never change. That was right when the
      # root was the only page worth arriving at. It stops being right the moment
      # there is a second thing to arrive at, because a reader who follows a
      # link to the site now lands on the landscape with no indication that
      # anything else exists.
      #
      # **The cost is one address, and it is cheaper than it sounds.** The
      # landscape's old address becomes the front page, which links straight to
      # the landscape — so a bookmark or a link already in the wild arrives
      # somewhere useful and one tap from where it was going, rather than at a
      # 404. The front page also makes the two applications discoverable to
      # somebody who has never seen either, which is the whole reason for it.
      #
      # One site rather than three, still. The alternative is a Pages site per
      # application, which would let each be deployed and rolled back
      # independently; what argues against it here is that the two share six
      # packages and a file format, and a reader following a link from a model's
      # documentation to the model itself should not have to cross a hostname.
      # **If the modeller grows its own routing, or the applications need
      # independent deploys, this is the line to move.**
      #
      # All of it works because every one of the three is built with `base: "./"`
      # — or, for the front page, links relatively for the same reason — so every
      # address inside every `index.html` resolves correctly from wherever it
      # lands. That is the property that makes one site possible rather than
      # three.
      - name: Collect the front page and the built apps
        run: |
          mkdir -p dist/bm-sculpt
          cp -r apps/homepage/dist/. dist/
          cp -r apps/bm-sculpt/dist/. dist/bm-sculpt/
          cp -r apps/sdf-modeller/dist/. dist/sdf-modeller/

      # No `404.html` is copied over the way the sibling repository does for its
      # routed applications, because none of the three here has any routes. The
      # front page is one page; the landscape's only addresses are query strings
      # — `?spike`, `?lod=off` — and the modeller's are none at all, and a
      # browser never sends a query string to a server. So there is no address
      # for GitHub Pages to be asked about and nothing to answer wrongly.
      #
      # `enable_jekyll: false` is the action's default, and is stated because it is
      # the difference between the site being served as built and Jekyll being
      # allowed to process it first.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          enable_jekyll: false
